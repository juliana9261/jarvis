<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis</title>
  <style>
    /* Cores do "traje": vermelho e dourado do Homem de Ferro, sobre fundo escuro */
    :root {
      --fundo: #14161c;
      --painel: #1d2029;
      --texto: #e8e6e1;
      --suave: #9a9ca5;
      --ouro: #e0b44c;
      --vermelho: #b8322a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--fundo);
      color: var(--texto);
      font: 17px/1.55 system-ui, -apple-system, sans-serif;
    }
    header {
      padding: 20px 16px 12px;
      text-align: center;
      border-bottom: 1px solid #2a2e3a;
    }
    header h1 { margin: 0; font-size: 22px; letter-spacing: 0.04em; color: var(--ouro); }
    header p { margin: 4px 0 0; font-size: 14px; color: var(--suave); }

    /* Área onde aparecem as falas */
    #conversa {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px;
      overflow-y: auto;
    }
    .fala { max-width: 85%; margin: 0 0 14px; padding: 10px 14px; border-radius: 14px; }
    .voce { margin-left: auto; background: var(--vermelho); color: #fff; border-bottom-right-radius: 4px; }
    .jarvis { background: var(--painel); border-bottom-left-radius: 4px; border-left: 3px solid var(--ouro); }
    .pensando { color: var(--suave); font-style: italic; }

    /* Caixa de texto e botão */
    form {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 16px 20px;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid #2f3341;
      border-radius: 10px;
      background: var(--painel);
      color: var(--texto);
      font: inherit;
    }
    input:focus { outline: 2px solid var(--ouro); outline-offset: 1px; }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--ouro);
      color: #1a1a1a;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>
  <header>
    <h1>J.A.R.V.I.S.</h1>
    <p>O assistente pessoal da Juliana</p>
  </header>

  <main id="conversa">
    <div class="fala jarvis">E aí! Sou o Jarvis. Pode perguntar qualquer coisa sobre a Juliana.</div>
  </main>

  <form id="formulario">
    <input id="pergunta" placeholder="Digite sua pergunta…" autocomplete="off" autofocus>
    <button id="enviar">Enviar</button>
  </form>

  <script>
    const conversa = document.getElementById("conversa");
    const formulario = document.getElementById("formulario");
    const campo = document.getElementById("pergunta");
    const botao = document.getElementById("enviar");

    // Põe uma fala na tela. Usa textContent (e não innerHTML) para que nenhum
    // texto vindo de fora consiga virar código dentro da página.
    function mostrar(texto, quem) {
      const fala = document.createElement("div");
      fala.className = "fala " + quem;
      fala.textContent = texto;
      conversa.appendChild(fala);
      conversa.scrollTop = conversa.scrollHeight;
      return fala;
    }

    // A voz agora sai do navegador, que usa as mesmas vozes do Mac.
    function falar(texto) {
      const fala = new SpeechSynthesisUtterance(texto);
      fala.lang = "pt-BR";
      fala.rate = 0.9; // um pouco mais lento, como no terminal
      const luciana = speechSynthesis.getVoices().find(v => v.name.startsWith("Luciana"));
      if (luciana) fala.voice = luciana;
      speechSynthesis.speak(fala);
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault(); // não recarrega a página ao enviar
      const pergunta = campo.value.trim();
      if (!pergunta) return;

      mostrar(pergunta, "voce");
      campo.value = "";
      botao.disabled = true;
      const pensando = mostrar("Pensando…", "jarvis pensando");

      try {
        // É aqui que a página chama a SUA API: POST /perguntar
        const resposta = await fetch("/perguntar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pergunta: pergunta }),
        });
        const dados = await resposta.json();
        pensando.remove();
        mostrar(dados.resposta, "jarvis");
        falar(dados.resposta);
      } catch (erro) {
        pensando.remove();
        mostrar("Ops, perdi a conexão com o servidor. Ele está ligado?", "jarvis");
      } finally {
        botao.disabled = false;
        campo.focus();
      }
    });
  </script>
</body>
</html>
